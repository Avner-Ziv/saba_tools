<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>הזמנת סרט - סינמטק חיפה</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f9;
      margin: 0;
      padding: 16px;
      direction: rtl;
    }
    h1 {
      text-align: center;
      color: #333;
      font-size: 28px;
    }
    .movie-card {
      background: white;
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 16px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      border-right: 6px solid #007bff;
    }
    .movie-title {
      font-size: 22px;
      font-weight: bold;
      color: #111;
      margin-bottom: 8px;
    }
    .movie-info {
      font-size: 18px;
      color: #555;
      margin-bottom: 12px;
    }
    .btn-order {
      display: block;
      width: 100%;
      background-color: #25D366;
      color: white;
      text-align: center;
      padding: 14px 0;
      font-size: 20px;
      font-weight: bold;
      border-radius: 8px;
      text-decoration: none;
    }
  </style>
</head>
<body>

  <h1>🎬 הזמנת סרט לסינמטק</h1>
  <div id="movies-container">
    <p style="text-align: center; font-size: 20px;">טוען סרטים מסינמטק חיפה...</p>
  </div>

  <script>
    const USER_NAME = "אלי זיו";
    const PHONE_NUMBER = "972525559300";

    async function loadMovies() {
      const container = document.getElementById('movies-container');
      try {
        // טעינת הנתונים שהסקריפט מייצר
        const response = await fetch('movies.json?t=' + new Date().getTime());
        const movies = await response.json();

        if (!movies || movies.length === 0) {
          container.innerHTML = '<p style="text-align:center; font-size:20px;">לא נמצאו הקרנות קרובות כרגע.</p>';
          return;
        }

        container.innerHTML = '';
        movies.forEach(movie => {
          // קביעת מיקומים לפי האולם
          const isRappaport = movie.hall && movie.hall.includes("רפפורט");
          const row = isRappaport ? "7" : "4";
          const seats = isRappaport ? "24-25" : "17-18";
          const hallName = isRappaport ? "רפפורט" : "סינמטק";

          const message = `שלום, אשמח להזמין מקום (כרטיס זוגי):
- מזמין: ${USER_NAME}
- שם הסרט: ${movie.title}
- תאריך ושעה: ${movie.date}, ${movie.time}
- אולם: ${hallName}
- מקומות מבוקשים: שורה ${row}, כיסאות ${seats} (או בסמוך אליהם)

תודה!`;

          const waLink = `https://wa.me/${PHONE_NUMBER}?text=${encodeURIComponent(message)}`;

          const card = document.createElement('div');
          card.className = 'movie-card';
          card.innerHTML = `
            <div class="movie-title">${movie.title}</div>
            <div class="movie-info">📅 ${movie.date} | ⏰ ${movie.time}</div>
            <div class="movie-info">🏛️ אולם: ${hallName} (שורה ${row})</div>
            <a class="btn-order" href="${waLink}" target="_blank">📲 שלח הזמנה ב-WhatsApp</a>
          `;
          container.appendChild(card);
        });
      } catch (err) {
        container.innerHTML = '<p style="text-align:center; font-size:20px;">טוען את לוח ההקרנות... (אנא רענן עוד דקה)</p>';
      }
    }

    loadMovies();
  </script>
</body>
</html>
