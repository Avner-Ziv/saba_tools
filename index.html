<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>הזמנת סרט - סינמטק חיפה</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f4f4f9;
      margin: 0;
      padding: 16px;
      direction: rtl;
    }
    h1 {
      text-align: center;
      color: #333;
      font-size: 28px;
      margin-bottom: 20px;
    }
    .movie-card {
      background: white;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 18px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.08);
      border-right: 6px solid #007bff;
    }
    .movie-card.rappaport {
      border-right-color: #e67e22; /* צבע מובלט לאולם רפפורט */
    }
    .movie-title {
      font-size: 24px;
      font-weight: bold;
      color: #111;
      margin-bottom: 10px;
    }
    .movie-info {
      font-size: 19px;
      color: #333;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .movie-desc {
      font-size: 16px;
      color: #555;
      margin-top: 10px;
      margin-bottom: 14px;
      line-height: 1.4;
      background: #f8f9fa;
      padding: 10px 14px;
      border-radius: 8px;
    }
    .btn-order {
      display: block;
      width: 100%;
      background-color: #25D366;
      color: white;
      text-align: center;
      padding: 14px 0;
      font-size: 20px;
      font-weight: bold;
      border-radius: 8px;
      text-decoration: none;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <h1>🎬 הזמנת סרט לסינמטק</h1>
  <div id="movies-container">
    <p style="text-align: center; font-size: 20px;">טוען סרטים מסינמטק חיפה...</p>
  </div>

  <script>
    const USER_NAME = "אלי זיו";
    const PHONE_NUMBER = "972525559300";

    async function loadMovies() {
      const container = document.getElementById('movies-container');
      try {
        const response = await fetch('movies.json?t=' + new Date().getTime());
        const movies = await response.json();

        if (!movies || movies.length === 0) {
          container.innerHTML = '<p style="text-align:center; font-size:20px;">לא נמצאו הקרנות קרובות כרגע.</p>';
          return;
        }

        container.innerHTML = '';
        movies.forEach(movie => {
          // בדיקת אולם והגדרת שורה וכיסאות
          const isRappaport = movie.hall && movie.hall.includes("רפפורט");
          const row = isRappaport ? "7" : "4";
          const seats = isRappaport ? "24-25" : "17-18";
          const hallName = isRappaport ? "רפפורט" : "סינמטק";

          const message = `שלום, אשמח להזמין מקום (כרטיס זוגי):
- מזמין: ${USER_NAME}
- שם הסרט: ${movie.title}
- תאריך ושעה: ${movie.date}, ${movie.time}
- אולם: ${hallName}
- מקומות מבוקשים: שורה ${row}, כיסאות ${seats} (או בסמוך אליהם)

תודה!`;

          const waLink = `https://wa.me/${PHONE_NUMBER}?text=${encodeURIComponent(message)}`;

          const card = document.createElement('div');
          card.className = `movie-card ${isRappaport ? 'rappaport' : ''}`;
          
          let descHtml = movie.description ? `<div class="movie-desc">📝 ${movie.description}</div>` : '';

          card.innerHTML = `
            <div class="movie-title">${movie.title}</div>
            <div class="movie-info">📅 <b>תאריך:</b> ${movie.date}</div>
            <div class="movie-info">⏰ <b>שעה:</b> ${movie.time}</div>
            <div class="movie-info">🏛️ <b>אולם:</b> ${hallName} (שורה מועדפת: ${row}, כיסאות: ${seats})</div>
            ${descHtml}
            <a class="btn-order" href="${waLink}" target="_blank">📲 שלח הזמנה ב-WhatsApp</a>
          `;
          container.appendChild(card);
        });
      } catch (err) {
        container.innerHTML = '<p style="text-align:center; font-size:20px;">טוען את לוח ההקרנות...</p>';
      }
    }

    loadMovies();
  </script>
</body>
</html>
