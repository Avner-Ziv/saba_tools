<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>הזמנת סרט</title>
  <meta name="application-name" content="הזמנת סרט">
  <meta name="apple-mobile-web-app-title" content="הזמנת סרט">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#1f3a5f">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <style>
    :root {
      --bg: #f4f4f9;
      --card: #ffffff;
      --text: #111111;
      --muted: #444444;
      --accent: #1f3a5f;
      --accent-2: #2e5a88;
      --cinematheque: #007bff;
      --rappaport: #e67e22;
      --other: #888888;
      --wa: #1da851;
      --line: #d5d9e0;
    }
    html { font-size: 16px; }
    * { box-sizing: border-box; }
    body {
      font-family: Arial, 'Segoe UI', Tahoma, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      line-height: 1.4;
    }
    #app { max-width: 640px; margin: 0 auto; padding: 0 1rem 2rem; }

    /* פס עליון */
    .topbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.5rem;
      padding: 0.8rem 0 0.4rem;
    }
    /* הכפתורים בשורה עליונה, הכותרת מתחתם ברוחב מלא */
    .topbar-title {
      order: 2;
      flex: 1 0 100%;
      font-size: 1.75rem;
      margin: 0.2rem 0 0;
      text-align: center;
    }
    .topbar-btn.settings { margin-inline-start: auto; }
    .topbar-btn {
      flex: none;
      font-size: 1.05rem;
      font-weight: bold;
      color: var(--accent);
      background: #fff;
      border: 2px solid var(--accent);
      border-radius: 10px;
      padding: 0.45rem 0.7rem;
      text-decoration: none;
      white-space: nowrap;
    }
    .content { padding-top: 0.3rem; }

    .updated {
      text-align: center;
      font-size: 1rem;
      color: var(--muted);
      margin-bottom: 1rem;
    }
    .warning, .note {
      border-radius: 10px;
      padding: 0.75rem 0.9rem;
      font-size: 1.1rem;
      margin-bottom: 1rem;
    }
    .warning { background: #fff3cd; border: 2px solid #e0b100; }
    .note { background: #e8f0fb; border: 2px solid #a9c4ea; }
    .note a { color: var(--accent); font-weight: bold; }
    .message {
      text-align: center;
      font-size: 1.3rem;
      margin-top: 2.5rem;
    }

    /* רשימת הקרנות */
    .day-header {
      position: sticky;
      top: 0;
      z-index: 1;
      background: var(--accent);
      color: #fff;
      font-size: 1.375rem;
      font-weight: bold;
      padding: 0.6rem 0.9rem;
      border-radius: 10px;
      margin: 1.6rem 0 0.75rem;
    }
    .day-header .tag {
      background: #ffd54a;
      color: #222;
      border-radius: 6px;
      padding: 1px 8px;
      margin-inline-start: 8px;
      font-size: 1.1rem;
    }
    .movie-card {
      background: var(--card);
      border-radius: 12px;
      padding: 1.1rem;
      margin-bottom: 1rem;
      box-shadow: 0 3px 10px rgba(0,0,0,0.08);
      border-right: 8px solid var(--cinematheque);
    }
    .movie-card.rappaport { border-right-color: var(--rappaport); }
    .movie-card.other { border-right-color: var(--other); }
    .movie-time { font-size: 1.6rem; font-weight: bold; color: var(--accent); }
    .movie-title { font-size: 1.55rem; font-weight: bold; margin: 0.25rem 0 0.6rem; }
    .movie-info { font-size: 1.2rem; margin-bottom: 0.4rem; }
    .nowrap { white-space: nowrap; }
    .movie-meta { font-size: 1.05rem; color: var(--muted); margin-bottom: 0.4rem; }
    .movie-desc {
      font-size: 1.05rem;
      color: #333;
      background: #f3f4f6;
      padding: 0.6rem 0.9rem;
      border-radius: 8px;
      margin: 0.6rem 0 0.75rem;
    }
    .btn-order, .btn-primary {
      display: block;
      width: 100%;
      color: #fff;
      text-align: center;
      padding: 1rem 0;
      font-size: 1.3rem;
      font-weight: bold;
      border-radius: 10px;
      text-decoration: none;
      margin-top: 0.5rem;
      border: none;
    }
    .btn-order { background: var(--wa); }
    .btn-primary { background: var(--accent); margin-top: 1.5rem; }
    .btn-order:active, .btn-primary:active { filter: brightness(0.9); }

    /* מסך הבית עם כמה מודולים */
    .tiles { display: grid; gap: 1rem; margin-top: 1rem; }
    .tile {
      display: flex; align-items: center; gap: 1rem;
      background: #fff; border-radius: 12px; padding: 1.2rem;
      box-shadow: 0 3px 10px rgba(0,0,0,0.08);
      text-decoration: none; color: var(--text);
    }
    .tile-icon { font-size: 2.4rem; }
    .tile-name { font-size: 1.5rem; font-weight: bold; }

    /* הגדרות */
    .settings-section {
      background: #fff;
      border-radius: 12px;
      padding: 1rem 1.1rem 0.4rem;
      margin-top: 1rem;
      box-shadow: 0 3px 10px rgba(0,0,0,0.06);
    }
    .settings-title { font-size: 1.4rem; margin: 0 0 0.6rem; color: var(--accent); }
    .settings-subtitle {
      font-size: 1.2rem; margin: 1.2rem 0 0.4rem; color: var(--accent-2);
      border-top: 1px solid var(--line); padding-top: 0.9rem;
    }
    .field { margin-bottom: 1.1rem; }
    .field-label { font-size: 1.2rem; font-weight: bold; margin-bottom: 0.25rem; }
    .field-help { font-size: 1rem; color: var(--muted); margin-bottom: 0.45rem; }
    .text-input {
      width: 100%;
      font-size: 1.3rem;
      padding: 0.65rem 0.75rem;
      border: 2px solid var(--line);
      border-radius: 10px;
      font-family: inherit;
    }
    .text-input:focus { outline: 3px solid #9cc1f0; border-color: var(--accent-2); }
    .choice-row { display: flex; flex-wrap: wrap; gap: 0.5rem; }
    .choice-btn {
      flex: 1 1 auto;
      min-width: 5.5rem;
      font-size: 1.15rem;
      font-family: inherit;
      padding: 0.7rem 0.8rem;
      border-radius: 10px;
      border: 2px solid var(--line);
      background: #fff;
      color: var(--text);
    }
    .choice-btn[aria-pressed="true"] {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      font-weight: bold;
    }
    .choice-btn[aria-pressed="true"]::before { content: "✓ "; }
    .stepper { display: flex; align-items: center; gap: 1rem; }
    .stepper-btn {
      width: 3.4rem; height: 3.4rem;
      font-size: 1.8rem; font-weight: bold;
      border-radius: 50%;
      border: 2px solid var(--accent);
      background: #fff; color: var(--accent);
    }
    .stepper-value { font-size: 1.8rem; font-weight: bold; min-width: 2rem; text-align: center; }
    .btn-link {
      display: block; margin: 1.2rem auto 0;
      background: none; border: none;
      color: var(--muted); font-size: 1rem; text-decoration: underline;
      font-family: inherit;
    }
    .save-status {
      position: fixed; bottom: 1.2rem; left: 50%; transform: translateX(-50%);
      background: #1a7f37; color: #fff; font-size: 1.2rem; font-weight: bold;
      padding: 0.6rem 1.2rem; border-radius: 999px;
      opacity: 0; transition: opacity 0.2s; pointer-events: none;
    }
    .save-status.show { opacity: 1; }
    .save-status.error { background: #b42318; }

    @media (max-width: 380px) {
      .topbar-title { font-size: 1.55rem; }
      .topbar-btn { font-size: 0.95rem; padding: 0.4rem 0.55rem; }
    }
  </style>
</head>
<body>
  <div id="app">
    <p class="message">טוען…</p>
  </div>
  <noscript><p class="message">כדי להשתמש באפליקציה צריך לאפשר JavaScript בדפדפן.</p></noscript>
  <!-- בכל עדכון קוד מעלים את המספר, כדי שהטלפון לא יטען גרסה ישנה מהזיכרון -->
  <script type="module" src="core/app.js?v=3"></script>
</body>
</html>
