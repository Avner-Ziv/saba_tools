<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>הזמנת סרט</title>
  <meta name="application-name" content="הזמנת סרט">
  <meta name="apple-mobile-web-app-title" content="הזמנת סרט">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#1f3a5f">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <style>
    :root {
      --bg: #f4f4f9;
      --card: #ffffff;
      --text: #111111;
      --muted: #444444;
      --accent: #1f3a5f;
      --cinematheque: #007bff;
      --rappaport: #e67e22;
      --other: #888888;
      --wa: #1da851;
    }
    * { box-sizing: border-box; }
    body {
      font-family: Arial, 'Segoe UI', Tahoma, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 16px;
      line-height: 1.4;
    }
    main { max-width: 640px; margin: 0 auto; }
    h1 {
      text-align: center;
      font-size: 30px;
      margin: 4px 0 6px;
    }
    .updated {
      text-align: center;
      font-size: 16px;
      color: var(--muted);
      margin-bottom: 18px;
    }
    .warning {
      background: #fff3cd;
      border: 2px solid #e0b100;
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 18px;
      margin-bottom: 18px;
    }
    .day-header {
      position: sticky;
      top: 0;
      z-index: 1;
      background: var(--accent);
      color: #fff;
      font-size: 22px;
      font-weight: bold;
      padding: 10px 14px;
      border-radius: 10px;
      margin: 26px 0 12px;
    }
    .day-header .tag {
      background: #ffd54a;
      color: #222;
      border-radius: 6px;
      padding: 1px 8px;
      margin-inline-start: 8px;
      font-size: 18px;
    }
    .movie-card {
      background: var(--card);
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 16px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.08);
      border-right: 8px solid var(--cinematheque);
    }
    .movie-card.rappaport { border-right-color: var(--rappaport); }
    .movie-card.other { border-right-color: var(--other); }
    .movie-time {
      font-size: 26px;
      font-weight: bold;
      color: var(--accent);
    }
    .movie-title {
      font-size: 25px;
      font-weight: bold;
      margin: 4px 0 10px;
    }
    .movie-info {
      font-size: 19px;
      margin-bottom: 6px;
    }
    .movie-meta {
      font-size: 17px;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .movie-desc {
      font-size: 17px;
      color: #333;
      background: #f3f4f6;
      padding: 10px 14px;
      border-radius: 8px;
      margin: 10px 0 12px;
    }
    .btn-order {
      display: block;
      width: 100%;
      background: var(--wa);
      color: #fff;
      text-align: center;
      padding: 16px 0;
      font-size: 21px;
      font-weight: bold;
      border-radius: 10px;
      text-decoration: none;
      margin-top: 8px;
    }
    .btn-order:active { filter: brightness(0.9); }
    .message {
      text-align: center;
      font-size: 21px;
      margin-top: 40px;
    }
  </style>
</head>
<body>
<main>
  <h1>🎬 הזמנת סרט לסינמטק</h1>
  <div class="updated" id="updated"></div>
  <div id="movies-container">
    <p class="message">טוען סרטים מסינמטק חיפה…</p>
  </div>
</main>

<script>
  const USER_NAME = "אלי זיו";
  const PHONE_NUMBER = "972525559300";
  const STALE_AFTER_HOURS = 48;

  // מקומות קבועים לפי אולם
  const HALLS = {
    cinematheque: { name: "סינמטק", row: "4", seats: "17-18" },
    rappaport:    { name: "רפפורט", row: "7", seats: "24-25" }
  };

  // יוצר אלמנט עם טקסט בלבד (בלי innerHTML, כדי שתווים מוזרים בשם סרט לא ישברו את הדף)
  function el(tag, className, text) {
    const e = document.createElement(tag);
    if (className) e.className = className;
    if (text !== undefined) e.textContent = text;
    return e;
  }

  function dayKey(d) {
    return d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate();
  }

  function buildMessage(s, hall) {
    const lines = [
      "שלום, אשמח להזמין מקום (כרטיס זוגי):",
      "- מזמין: " + USER_NAME,
      "- שם הסרט: " + s.title,
      "- תאריך ושעה: " + s.weekday + ", " + s.date + ", " + s.time
    ];
    if (hall) {
      lines.push("- אולם: " + hall.name);
      lines.push("- מקומות מבוקשים: שורה " + hall.row + ", כיסאות " + hall.seats + " (או בסמוך אליהם)");
    } else {
      lines.push("- אולם: " + s.hall_raw);
    }
    lines.push("", "תודה!");
    return lines.join("\n");
  }

  function renderCard(s) {
    const hall = HALLS[s.hall_key] || null;
    const card = el("div", "movie-card " + (hall ? s.hall_key : "other"));

    card.appendChild(el("div", "movie-time", "⏰ " + s.time));
    card.appendChild(el("div", "movie-title", s.title));

    const hallText = hall
      ? "🏛️ אולם: " + hall.name + " (שורה " + hall.row + ", כיסאות " + hall.seats + ")"
      : "🏛️ אולם: " + s.hall_raw;
    card.appendChild(el("div", "movie-info", hallText));

    if (s.info) card.appendChild(el("div", "movie-meta", s.info));
    if (s.synopsis) card.appendChild(el("div", "movie-desc", s.synopsis));

    const link = el("a", "btn-order", "📲 שלח הזמנה ב-WhatsApp");
    link.href = "https://wa.me/" + PHONE_NUMBER + "?text=" + encodeURIComponent(buildMessage(s, hall));
    link.target = "_blank";
    link.rel = "noopener";
    card.appendChild(link);
    return card;
  }

  function showMessage(container, text) {
    container.replaceChildren(el("p", "message", text));
  }

  async function loadMovies() {
    const container = document.getElementById("movies-container");
    const updatedEl = document.getElementById("updated");

    let data;
    try {
      const response = await fetch("movies.json?t=" + Date.now());
      if (!response.ok) throw new Error("HTTP " + response.status);
      data = await response.json();
    } catch (err) {
      showMessage(container, "לא הצלחתי לטעון את רשימת הסרטים. נסה שוב בעוד כמה דקות.");
      return;
    }

    // תמיכה גם בפורמט הישן (מערך פשוט)
    const screenings = Array.isArray(data) ? data : (data.screenings || []);

    if (data.updated_at) {
      const updated = new Date(data.updated_at);
      updatedEl.textContent = "הרשימה עודכנה: " +
        updated.toLocaleDateString("he-IL") + " בשעה " +
        updated.toLocaleTimeString("he-IL", { hour: "2-digit", minute: "2-digit" });

      if ((Date.now() - updated.getTime()) / 36e5 > STALE_AFTER_HOURS) {
        const warn = el("div", "warning",
          "שים לב: הרשימה לא התעדכנה כבר כמה ימים. כדאי לוודא את המועד מול הסינמטק.");
        updatedEl.after(warn);
      }
    }

    // מסננים הקרנות שכבר התחילו (הקובץ מתעדכן פעמיים ביום)
    const now = Date.now();
    const upcoming = screenings
      .filter(s => !s.starts_at || new Date(s.starts_at).getTime() > now)
      .sort((a, b) => (a.starts_at || "").localeCompare(b.starts_at || ""));

    if (upcoming.length === 0) {
      showMessage(container, "לא נמצאו הקרנות קרובות כרגע.");
      return;
    }

    const today = new Date();
    const tomorrow = new Date(today.getTime() + 864e5);
    const todayKey = dayKey(today);
    const tomorrowKey = dayKey(tomorrow);

    container.replaceChildren();
    let currentDay = null;
    for (const s of upcoming) {
      const d = s.starts_at ? new Date(s.starts_at) : null;
      const key = d ? dayKey(d) : s.date;
      if (key !== currentDay) {
        currentDay = key;
        const header = el("div", "day-header", s.weekday + ", " + s.date);
        if (key === todayKey) header.appendChild(el("span", "tag", "היום"));
        else if (key === tomorrowKey) header.appendChild(el("span", "tag", "מחר"));
        container.appendChild(header);
      }
      container.appendChild(renderCard(s));
    }
  }

  loadMovies();
</script>
</body>
</html>
