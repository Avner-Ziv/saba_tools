name: Update Cinema Movies

on:
  schedule:
    # פעמיים ביום: 06:23 ו-18:23 שעון ישראל (בחורף; בקיץ שעה מאוחר יותר)
    - cron: '23 4,16 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-movies
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Fetch schedule
        run: python fetch_movies.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add movies.json
          if git diff --cached --quiet; then
            echo "No changes in movies.json"
            exit 0
          fi
          git commit -m "Update movies list"
          git pull --rebase
          git push
