name: Update Cinema Movies

on:
  schedule:
    # פעמיים ביום: 06:23 ו-18:23 שעון ישראל (בחורף; בקיץ שעה מאוחר יותר)
    - cron: '23 4,16 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      # צעד לכל מודול. כישלון של מודול אחד לא עוצר את האחרים.
      # למודול חדש: מעתיקים את הצעד הזה, מחליפים id ושם קובץ, ומוסיפים אותו לבדיקה בסוף.
      - name: "Scrape: cinema-haifa"
        id: cinema_haifa
        continue-on-error: true
        run: python scrapers/cinema_haifa.py

      - name: Commit and push if changed
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes"
            exit 0
          fi
          git commit -m "Update data"
          git pull --rebase
          git push

      # אם אחד הסורקים נכשל, הריצה מסומנת כנכשלת ו-GitHub שולח מייל
      - name: Fail if any scraper failed
        if: steps.cinema_haifa.outcome == 'failure'
        run: |
          echo "At least one scraper failed. See the logs above."
          exit 1
